<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 메타(페이스북) 도메인 인증 — 픽셀·총 이벤트 측정에 필요합니다. 지우지 마세요. -->
<meta name="facebook-domain-verification" content="4m1chvnhh6wm21d269e0a0fn6gaw41">
<title>주문 결과 · 마음 사용 설명서</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EA; --surface:#FFFFFF;
    --ink:#2B2620; --ink-soft:#6E6658; --ink-faint:#A79E8E;
    --line:#ECE2CD;
    --blue:#4C8CCB; --blue-deep:#2F6FA8; --blue-soft:#EAF1F9;
    --gold:#F2B620; --coral:#E86B5E; --green:#54B491;
    --display:'Jua','Noto Sans KR',sans-serif;
    --sans:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.7;
       -webkit-font-smoothing:antialiased;word-break:keep-all}
  .page{max-width:520px;margin:0 auto;padding:40px 20px 48px}
  a{color:var(--blue-deep)}
  [hidden]{display:none!important}

  .card{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;
        padding:34px 26px;text-align:center}
  .badge{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;
         margin:0 auto 16px;font-size:27px}
  .badge.ok{background:#EAF6F1;border:2px solid var(--green)}
  .badge.err{background:#FDECEA;border:2px solid var(--coral)}
  .badge.wait{background:var(--blue-soft);border:2px solid var(--blue)}
  h1{font-family:var(--display);font-size:23px;font-weight:400;margin-bottom:8px}
  .lead{font-size:13.5px;color:var(--ink-soft);margin-bottom:20px}

  table{border-collapse:collapse;width:100%;font-size:13px;text-align:left;margin-bottom:18px}
  th,td{border-bottom:1px solid var(--line);padding:9px 4px;color:var(--ink-soft);vertical-align:top}
  th{font-weight:700;color:var(--ink);white-space:nowrap;width:38%}
  tr:last-child th,tr:last-child td{border-bottom:0}
  .amt{font-weight:700;color:var(--ink);font-size:15px}

  .btn{display:inline-block;font-size:14px;font-weight:700;color:#fff;background:var(--blue);
       border:0;border-radius:12px;padding:12px 24px;cursor:pointer;text-decoration:none;margin:4px}
  .btn:hover{background:var(--blue-deep)}
  .btn.ghost{background:#fff;color:var(--ink-soft);border:1.5px solid var(--line)}
  .btn.ghost:hover{border-color:var(--blue);color:var(--blue-deep)}

  .code{font-size:11.5px;color:var(--ink-faint);margin-top:14px;word-break:break-all}
  .flinks{margin-top:24px;text-align:center;font-size:12px}
  .flinks a{color:var(--ink-soft);text-decoration:none;padding:0 8px}
  .flinks a:hover{color:var(--blue-deep);text-decoration:underline}
</style>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/assets/img/favicon-512.png" sizes="512x512">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
<div class="page">

  <!-- 승인 처리 중 -->
  <div class="card" id="pending">
    <div class="badge wait">⏳</div>
    <h1>결제를 확인하고 있어요</h1>
    <p class="lead">창을 닫지 말고 잠시만 기다려 주세요.</p>
  </div>

  <!-- 성공 -->
  <div class="card" id="success" hidden>
    <div class="badge ok">✓</div>
    <h1>주문이 완료되었습니다</h1>
    <p class="lead">주문 확인 메일을 보내드렸어요. 배송이 시작되면 다시 알려드릴게요.</p>
    <table>
      <tbody>
        <tr><th>주문번호</th><td id="rOrderId">—</td></tr>
        <tr><th>상품</th><td id="rProduct">—</td></tr>
        <tr><th>받는 분</th><td id="rBuyer">—</td></tr>
        <tr><th>결제 금액</th><td class="amt" id="rAmount">—</td></tr>
      </tbody>
    </table>
    <a class="btn" href="/">홈으로</a>
    <a class="btn ghost" id="receiptLink" href="#" target="_blank" rel="noopener" hidden>영수증 보기</a>
  </div>

  <!-- 실패 -->
  <div class="card" id="failed" hidden>
    <div class="badge err">!</div>
    <h1>결제가 완료되지 않았어요</h1>
    <p class="lead" id="failMsg">결제가 취소되었거나 승인되지 않았습니다.</p>
    <a class="btn" href="/checkout.html">다시 시도하기</a>
    <a class="btn ghost" href="mailto:pluspsychology@gmail.com?subject=%EA%B2%B0%EC%A0%9C%20%EB%AC%B8%EC%9D%98">문의하기</a>
    <p class="code" id="failCode"></p>
  </div>

  <div class="flinks">
    <a href="/">홈</a>·<a href="/terms.html">이용약관</a>·<a href="/privacy.html">개인정보처리방침</a>
  </div>

</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var q = new URLSearchParams(window.location.search);

  function showOnly(id){
    ['pending','success','failed'].forEach(function(k){ $(k).hidden = (k !== id); });
  }

  function fail(message, code){
    $('failMsg').textContent = message || '결제가 취소되었거나 승인되지 않았습니다.';
    $('failCode').textContent = code ? ('오류 코드: ' + code) : '';
    showOnly('failed');
  }

  var paymentKey = q.get('paymentKey');
  var orderId = q.get('orderId');
  var amount = q.get('amount');

  // 토스가 실패로 리다이렉트한 경우 code/message를 붙여 보냅니다
  if (!paymentKey) {
    fail(q.get('message'), q.get('code'));
    return;
  }

  fetch('/api/confirm', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ paymentKey: paymentKey, orderId: orderId, amount: Number(amount) })
  })
  .then(function(res){
    return res.json().catch(function(){ return {}; }).then(function(data){
      return {ok: res.ok, data: data};
    });
  })
  .then(function(r){
    if (!r.ok || !r.data.ok){
      fail(r.data.error, r.data.code);
      return;
    }
    var o = r.data.order || {};
    $('rOrderId').textContent = o.orderId || orderId;
    $('rProduct').textContent = (o.productName || '') + (o.quantity > 1 ? ' × ' + o.quantity + '권' : '');
    $('rBuyer').textContent = (o.buyerName || '') + (o.buyerEmail ? ' · ' + o.buyerEmail : '');
    $('rAmount').textContent = typeof o.amount === 'number'
      ? '₩' + o.amount.toLocaleString('ko-KR')
      : '—';
    if (r.data.receiptUrl){
      $('receiptLink').href = r.data.receiptUrl;
      $('receiptLink').hidden = false;
    }
    showOnly('success');
  })
  .catch(function(){
    fail('결제 확인 중 문제가 생겼습니다. 결제가 처리되었을 수 있으니 문의해 주세요.', null);
  });
})();
</script>
</body>
</html>
