<!-- 🚨 제목은 아래 스크립트가 상태에 맞게 바꿔칩니다.
     예전에는 '이메일 인증 완료' 로 고정돼 있어서, 링크가 만료돼 실패 화면이
     떠도 탭 제목만은 '완료' 라고 우겼습니다. TITLE 상수를 함께 고치세요. -->
<title>이메일 인증 · 김심리월드</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EA; --surface:#FFFFFF;
    --ink:#2B2620; --ink-soft:#6E6658; --ink-faint:#A79E8E;
    --line:#ECE2CD;
    --blue:#4C8CCB; --blue-deep:#2F6FA8;
    --coral:#E86B5E; --green:#54B491;
    --display:'Jua','Noto Sans KR',sans-serif;
    --sans:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.7;
       -webkit-font-smoothing:antialiased;word-break:keep-all;
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       min-height:100vh;padding:24px}
  a{color:var(--blue-deep)}
  [hidden]{display:none!important}

  .card{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;
        padding:38px 26px;text-align:center;max-width:420px;width:100%}
  .badge{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;
         margin:0 auto 18px;font-size:29px}
  .badge.ok{background:#EAF6F1;border:2px solid var(--green)}
  .badge.err{background:#FDECEA;border:2px solid var(--coral)}
  .badge.send{background:#EAF2FA;border:2px solid var(--blue)}
  h1{font-family:var(--display);font-size:23px;font-weight:400;margin-bottom:12px}
  p{font-size:14px;color:var(--ink-soft);margin-bottom:8px}
  .hint{font-size:12.5px;color:var(--ink-faint);margin-top:18px;line-height:1.6}
  .why{font-size:13px;color:var(--ink-soft);background:#FBF6EA;border:1px solid var(--line);
       border-radius:12px;padding:12px 14px;margin-top:16px;text-align:left}
  .why b{color:var(--ink)}

  .btn{display:inline-block;width:100%;font-size:15px;font-weight:700;color:#fff;background:var(--blue);
       border:0;border-radius:13px;padding:13px 26px;text-decoration:none;margin-top:18px;
       cursor:pointer;font-family:inherit}
  .btn:hover{background:var(--blue-deep)}
  .btn:disabled{background:var(--ink-faint);cursor:default}
  .linkbtn{display:inline-block;background:none;border:0;font-family:inherit;font-size:13px;
           color:var(--ink-soft);text-decoration:underline;cursor:pointer;margin-top:12px;padding:6px}
  .linkbtn:hover{color:var(--blue-deep)}

  /* 인증 메일 다시 받기 — 링크는 한 번만 쓸 수 있고 시간이 지나면 만료됩니다.
     여기서 바로 다시 받을 수 없으면 가입이 그대로 끝나버립니다. */
  .resend{margin-top:18px;text-align:left}
  .resend label{display:block;font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:6px}
  .resend input{width:100%;font-family:inherit;font-size:15px;color:var(--ink);
                background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px}
  .resend input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px rgba(76,140,203,.15)}

  .msg{font-size:13px;margin-top:10px;min-height:1.2em}
  .msg.ok{color:var(--green)}
  .msg.err{color:var(--coral)}

  .flinks{margin-top:22px;font-size:12px}
  .flinks a{color:var(--ink-soft);text-decoration:none;padding:0 7px}
  .flinks a:hover{color:var(--blue-deep);text-decoration:underline}
</style>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/assets/img/favicon-512.png" sizes="512x512">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>

  <!-- ── 성공 ──
       🚨 여기는 **웹에서 가입한 사람**이 도착하는 자리입니다.
       예전에는 '앱으로 돌아가기' 딥링크(world.kimsimri.app://) 하나뿐이라,
       웹으로 가입한 분이 눌러도 아무 일도 일어나지 않았습니다.
       앱은 자기 브라우저 안에서 이 주소를 열어 스스로 알아채므로,
       이 화면은 웹 기준으로 두고 앱 이야기는 하지 않습니다. -->
  <div class="card" id="ok" hidden>
    <div class="badge ok">✓</div>
    <h1>이메일 인증이 완료되었어요</h1>
    <p>이제 로그인하시면 됩니다.</p>
    <p>마음 배터리를 채우는 시간, 함께 시작해요.</p>
    <a class="btn" href="/login" id="okBtn">로그인하러 가기</a>
    <p class="hint" id="okCount"></p>
  </div>

  <!-- ── 실패 ── -->
  <div class="card" id="err" hidden>
    <div class="badge err" id="errBadge">!</div>
    <h1 id="errTitle">인증 링크를 사용할 수 없어요</h1>
    <p id="errMsg">링크가 만료되었거나 이미 사용된 것 같아요.</p>
    <div class="why" id="errWhy">
      인증 링크는 <b>한 번만</b> 쓸 수 있고, 일정 시간이 지나면 만료됩니다.
      이미 인증을 마치셨다면 그대로 로그인하시면 되고,
      아직이라면 아래에서 새 링크를 받아보세요.
    </div>

    <form class="resend" id="resendForm" novalidate>
      <label for="reEmail">가입할 때 쓴 이메일</label>
      <input type="email" id="reEmail" autocomplete="email" inputmode="email"
             placeholder="you@example.com" required>
      <button type="submit" class="btn" id="reBtn">인증 메일 다시 받기</button>
      <p class="msg" id="reMsg" role="status" aria-live="polite"></p>
    </form>

    <button type="button" class="linkbtn" onclick="location.href='/login'">로그인 화면으로 가기</button><br>
    <a class="linkbtn" href="mailto:pluspsychology@gmail.com?subject=%EC%9D%B4%EB%A9%94%EC%9D%BC%20%EC%9D%B8%EC%A6%9D%20%EB%AC%B8%EC%9D%98">문의하기</a>
  </div>

  <div class="flinks">
    <a href="/">홈</a>·<a href="/privacy">개인정보처리방침</a>·<a href="/terms">이용약관</a>
  </div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };

  // 탭 제목도 상태를 따라갑니다. 화면은 실패인데 제목만 '완료' 인 일이 없도록.
  var TITLE = { ok:'이메일 인증 완료 · 김심리월드',
                err:'인증 링크 오류 · 김심리월드',
                resend:'인증 메일 다시 받기 · 김심리월드' };

  var q = new URLSearchParams(location.search);
  // Supabase 는 결과를 쿼리로도, 해시로도 넘깁니다. 둘 다 봅니다.
  var h = new URLSearchParams(location.hash.replace(/^#/, ''));
  var pick = function(k){ return q.get(k) || h.get(k); };
  var err = pick('error_description') || pick('error');

  function clean(s){
    try { return decodeURIComponent(String(s).replace(/\+/g, ' ')); }
    catch (e) { return String(s).replace(/\+/g, ' '); }
  }

  // ── 실패, 또는 '인증 메일만 다시 받으러' 온 경우 ─────────
  //  로그인 화면에서 '아직 인증이 안 됐다' 는 답을 받으면 /confirm?resend=1 로 보냅니다.
  //  같은 폼을 두 벌 만들지 않기 위해 이 화면을 함께 씁니다.
  if (err) { showErr(clean(err), false); return; }
  if (q.get('resend')) { showErr('', true); return; }

  // ── 성공 ────────────────────────────────────────────────
  //  GoTrue 는 확인 링크를 서버에서 검증한 뒤 토큰을 **해시**에 실어 되돌려보냅니다.
  //  그 토큰을 login.html 과 같은 자리에 저장하면 인증 직후 그대로 로그인 상태가 됩니다
  //  (인증은 끝났는데 다시 로그인해야 하는 헛걸음을 없애기 위함).
  var token = h.get('access_token');
  if (token) {
    try {
      sessionStorage.setItem('ksw_token', token);
      var rt = h.get('refresh_token');
      if (rt) sessionStorage.setItem('ksw_refresh', rt);
      history.replaceState(null, '', location.pathname);   // 주소창에서 토큰을 지웁니다
      location.replace('/account');
      return;
    } catch (e) { /* 저장이 막히면 아래 안내 화면으로 */ }
  }

  // 토큰이 없으면(=서버에서 이미 확인이 끝난 형태) 로그인 화면으로 보냅니다.
  document.title = TITLE.ok;
  $('ok').hidden = false;
  var left = 5;
  var el = $('okCount');
  el.textContent = left + '초 뒤에 로그인 화면으로 이동합니다.';
  var t = setInterval(function(){
    left--;
    if (left <= 0){ clearInterval(t); location.href = '/login'; return; }
    el.textContent = left + '초 뒤에 로그인 화면으로 이동합니다.';
  }, 1000);
  // 사용자가 직접 누르면 자동 이동은 취소합니다 (두 번 이동하지 않도록)
  $('okBtn').addEventListener('click', function(){ clearInterval(t); });

  // ── 실패 화면 + 인증 메일 다시 받기 ──────────────────────
  function showErr(text, resendOnly){
    if (resendOnly){
      document.title = TITLE.resend;
      $('errBadge').textContent = '✉';
      $('errBadge').className = 'badge send';
      $('errTitle').textContent = '인증 메일을 다시 보내드릴게요';
      $('errMsg').textContent = '메일이 오지 않았거나 링크가 만료되었다면 여기서 새로 받으실 수 있어요.';
      $('errWhy').hidden = true;
    } else {
      document.title = TITLE.err;
      $('errMsg').textContent = text;
    }
    $('err').hidden = false;

    // 주소에 이메일이 실려 오면 채워둡니다 (/confirm?email=... )
    var pre = q.get('email');
    if (pre) $('reEmail').value = pre;

    var cooldown = 0, timer = null;
    function tick(){
      var b = $('reBtn');
      if (cooldown > 0){ b.disabled = true; b.textContent = '다시 받기 (' + cooldown + '초)'; }
      else { b.disabled = false; b.textContent = '인증 메일 다시 받기'; }
    }
    function start(){
      cooldown = 60; if (timer) clearInterval(timer); tick();
      timer = setInterval(function(){ cooldown--; tick(); if (cooldown <= 0) clearInterval(timer); }, 1000);
    }
    function say(t, kind){
      var m = $('reMsg'); m.textContent = t; m.className = 'msg' + (kind ? ' ' + kind : '');
    }

    $('resendForm').addEventListener('submit', function(e){
      e.preventDefault();
      if (cooldown > 0) return;
      var email = $('reEmail').value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
        say('이메일 주소를 다시 확인해 주세요.','err'); $('reEmail').focus(); return;
      }
      $('reBtn').disabled = true;
      say('보내는 중이에요…');

      fetch('/api/public-config').then(function(r){ return r.json(); }).then(function(c){
        if (!c || !c.supabaseUrl || !c.anonKey) throw new Error('설정을 불러오지 못했어요.');
        // 🚨 돌아올 주소는 **쿼리스트링**입니다. 본문에 넣으면 조용히 무시되고
        //    Supabase 의 Site URL 로 가버립니다 (login.html 과 같은 규칙).
        var back = '?redirect_to=' + encodeURIComponent(location.origin + '/confirm');
        return fetch(c.supabaseUrl + '/auth/v1/resend' + back, {
          method:'POST', headers:{'Content-Type':'application/json', apikey:c.anonKey},
          body: JSON.stringify({ type:'signup', email:email })
        // fetch 는 4xx 를 거부하지 않습니다. r.ok 를 보지 않으면
        // 한도에 걸려도 '보냈어요' 라고 거짓말을 하게 됩니다.
        }).then(function(r){
          return r.json().catch(function(){ return {}; }).then(function(d){
            if (!r.ok) throw new Error(resendMessage(d, r.status));
          });
        });
      }).then(function(){
        say('새 인증 메일을 보냈어요. 받은편지함과 스팸함을 확인해 주세요.','ok');
        start();
      }).catch(function(e){
        say(e.message || '보내지 못했어요. 잠시 후 다시 시도해 주세요.','err');
        cooldown = 0; tick();
      });
    });
  }

  // 실패 이유는 감추지 않고 서버 원문을 괄호로 함께 보여줍니다 —
  // 우리가 모르는 사유가 와도 화면만 보고 진단할 수 있어야 합니다.
  function resendMessage(d, status){
    var m = (d && (d.msg || d.error_description || d.message || d.error)) || '';
    var code = (d && d.error_code) || '';
    if (status === 429 || /rate limit/i.test(m) || /over_email_send/i.test(code)){
      var sec = (m.match(/(\d+)\s*seconds?/) || [])[1];
      return '메일 발송 한도에 걸렸어요. ' + (sec ? sec + '초' : '잠시') + ' 뒤에 다시 시도해 주세요.';
    }
    // 이미 인증이 끝난 계정은 GoTrue 가 재발송을 거부합니다 — 실패가 아니라 좋은 소식입니다.
    if (/already (been )?confirmed|already registered/i.test(m))
      return '이미 인증이 끝난 계정이에요. 그대로 로그인하시면 됩니다.';
    return '보내지 못했어요' + (m ? ' (' + m + ')' : '') + '.';
  }
})();
</script>
</body>
</html>
