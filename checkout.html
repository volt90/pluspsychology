<title>주문하기 · 마음 사용 설명서</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://js.tosspayments.com/v2/standard"></script>
<style>
  :root{
    --paper:#FBF6EA; --surface:#FFFFFF;
    --ink:#2B2620; --ink-soft:#6E6658; --ink-faint:#A79E8E;
    --line:#ECE2CD;
    --blue:#4C8CCB; --blue-deep:#2F6FA8; --blue-soft:#EAF1F9;
    --gold:#F2B620; --gold-soft:#FDF2D2; --coral:#E86B5E;
    --display:'Jua','Noto Sans KR',sans-serif;
    --sans:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.7;
       -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-x:hidden}
  .page{max-width:560px;margin:0 auto;padding:22px 20px 48px}
  a{color:var(--blue-deep)}
  [hidden]{display:none!important}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 2px}
  .home{font-family:var(--display);font-size:17px;color:var(--ink);text-decoration:none}
  .home:hover{color:var(--blue-deep)}

  h1{font-family:var(--display);font-size:24px;font-weight:400;margin:18px 0 4px}
  .sub{font-size:13px;color:var(--ink-soft);margin-bottom:18px}

  .card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:22px 20px;margin-bottom:14px}
  h2{font-size:14.5px;font-weight:700;margin-bottom:12px;padding-left:10px;border-left:4px solid var(--blue)}

  label.f{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin:12px 0 5px}
  label.f:first-of-type{margin-top:0}
  input[type=text],input[type=email],input[type=tel],select,textarea{
    width:100%;font-family:var(--sans);font-size:14px;color:var(--ink);
    padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;background:#fff;transition:border-color .16s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
  textarea{resize:vertical;min-height:64px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .hint{font-size:11.5px;color:var(--ink-faint);margin-top:5px}

  .qty{display:flex;align-items:center;gap:10px}
  .qty button{width:36px;height:36px;border:1.5px solid var(--line);background:#fff;border-radius:10px;
              font-size:17px;color:var(--ink);cursor:pointer;line-height:1}
  .qty button:hover{border-color:var(--blue);color:var(--blue-deep)}
  .qty input{width:56px;text-align:center}

  .sum{font-size:13.5px}
  .sum .line{display:flex;justify-content:space-between;padding:6px 0;color:var(--ink-soft)}
  .sum .total{display:flex;justify-content:space-between;padding:12px 0 0;margin-top:8px;
              border-top:1.5px solid var(--line);font-weight:700;color:var(--ink);font-size:16px}

  .agree{display:flex;gap:9px;align-items:flex-start;margin-top:12px;font-size:12.3px;color:var(--ink-soft);line-height:1.55}
  .agree input{flex:0 0 auto;margin-top:2px;width:16px;height:16px;accent-color:var(--blue);cursor:pointer}
  .agree label{cursor:pointer}
  .agree .req{color:var(--coral);font-weight:700}

  .minor{background:var(--gold-soft);border:1.5px solid var(--gold);border-radius:12px;padding:12px 14px;margin-top:12px}
  .minor .agree{margin-top:0;color:#7A5B08}

  .btn{width:100%;font-family:var(--sans);font-size:16px;font-weight:700;color:#fff;background:var(--blue);
       border:0;border-radius:14px;padding:15px;cursor:pointer;margin-top:16px;transition:background .16s}
  .btn:hover:not(:disabled){background:var(--blue-deep)}
  .btn:disabled{background:var(--ink-faint);cursor:not-allowed}

  .msg{margin-top:12px;font-size:13px;line-height:1.6;min-height:1.2em}
  .msg.err{color:#B4432F}
  .msg.ok{color:#1F6B50}

  .notice{background:var(--blue-soft);border:1.5px solid var(--blue);border-radius:14px;padding:16px 18px;margin-bottom:16px}
  .notice p{font-size:13px;color:var(--blue-deep);margin:0}
  .notice p+p{margin-top:8px}
  .notice strong{color:#1E4E77}

  .flinks{margin-top:26px;text-align:center;font-size:12px}
  .flinks a{color:var(--ink-soft);text-decoration:none;padding:0 8px}
  .flinks a:hover{color:var(--blue-deep);text-decoration:underline}

  @media (max-width:480px){
    .card{padding:18px 16px;border-radius:14px}
    .row2{grid-template-columns:1fr}
  }
</style>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/assets/img/favicon-512.png" sizes="512x512">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
<div class="page">

  <div class="topbar">
    <a class="home" href="/">&larr; 김심리월드</a>
  </div>

  <h1>주문하기</h1>
  <p class="sub">〈마음 사용 설명서〉 워크북</p>

  <!-- 결제가 아직 열리지 않았을 때 표시 -->
  <div class="notice" id="disabledNotice" hidden>
    <p><strong>아직 판매를 시작하지 않았습니다.</strong></p>
    <p>워크북 출시 준비 중입니다. <a href="/#contact">출시 알림을 신청</a>하시면 가장 먼저 알려드릴게요.</p>
  </div>

  <form id="orderForm">
    <div class="card">
      <h2>주문 상품</h2>
      <div class="qty">
        <button type="button" id="qtyMinus" aria-label="수량 줄이기">&minus;</button>
        <input type="text" id="qty" value="1" inputmode="numeric" aria-label="수량">
        <button type="button" id="qtyPlus" aria-label="수량 늘리기">+</button>
        <span style="font-size:13px;color:var(--ink-soft)">권</span>
      </div>
      <div class="sum" style="margin-top:14px">
        <div class="line"><span>상품 금액</span><span id="sumItems">—</span></div>
        <div class="line"><span>배송비</span><span id="sumShip">—</span></div>
        <div class="total"><span>결제 금액</span><span id="sumTotal">—</span></div>
      </div>
    </div>

    <div class="card">
      <h2>받는 분</h2>
      <label class="f" for="buyerName">이름</label>
      <input type="text" id="buyerName" autocomplete="name" required>

      <div class="row2">
        <div>
          <label class="f" for="buyerEmail">이메일</label>
          <input type="email" id="buyerEmail" autocomplete="email" required>
        </div>
        <div>
          <label class="f" for="buyerPhone">연락처</label>
          <input type="tel" id="buyerPhone" autocomplete="tel" placeholder="010-0000-0000" required>
        </div>
      </div>
      <p class="hint">주문 확인과 배송 안내를 이 정보로 보내드립니다.</p>
    </div>

    <div class="card">
      <h2>배송지</h2>
      <label class="f" for="shipCountry">배송 국가</label>
      <select id="shipCountry">
        <option value="KR" selected>대한민국</option>
      </select>
      <p class="hint">현재는 국내 배송만 가능합니다. 해외 배송은 준비 중입니다.</p>

      <label class="f" for="shipPostcode">우편번호</label>
      <input type="text" id="shipPostcode" autocomplete="postal-code" required>

      <label class="f" for="shipAddress1">주소</label>
      <input type="text" id="shipAddress1" autocomplete="address-line1" required>

      <label class="f" for="shipAddress2">상세 주소</label>
      <input type="text" id="shipAddress2" autocomplete="address-line2">

      <label class="f" for="shipMemo">배송 메모</label>
      <textarea id="shipMemo" placeholder="예: 부재 시 경비실에 맡겨주세요"></textarea>
    </div>

    <div class="card">
      <h2>동의</h2>

      <div class="agree">
        <input type="checkbox" id="agreeTerms">
        <label for="agreeTerms">
          <span class="req">[필수]</span>
          주문 내용을 확인했으며, <a href="/terms" target="_blank" rel="noopener">이용약관</a>과
          <a href="/privacy" target="_blank" rel="noopener">개인정보처리방침</a>에 따른
          결제 진행에 동의합니다.
        </label>
      </div>

      <div class="minor">
        <div class="agree">
          <input type="checkbox" id="agreeMinor">
          <label for="agreeMinor">
            <span class="req">[필수]</span>
            <strong>만 19세 미만인 경우</strong> 법정대리인의 동의를 받았음을 확인합니다.
          </label>
        </div>
      </div>

      <button type="submit" class="btn" id="payBtn">결제하기</button>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </div>
  </form>

  <div class="flinks">
    <a href="/">홈</a>·<a href="/terms">이용약관</a>·<a href="/privacy">개인정보처리방침</a>
  </div>

</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var MAX_QTY = 5;

  // 화면에 보이는 금액은 안내용입니다. 실제 결제 금액은 서버가 계산합니다.
  var DISPLAY = { unitPrice: 16900, shippingFee: 3000 };

  var form = $('orderForm'), msg = $('msg'), payBtn = $('payBtn');
  var qty = $('qty');

  // 판매 전이면 주문서를 감추고 안내만 띄웁니다.
  //  손님이 배송지까지 다 적은 뒤에야 '아직 판매 전'을 보게 되면 안 되니까요.
  fetch('/api/order')
    .then(function(r){ return r.json(); })
    .then(function(d){ if (!d || !d.enabled) paymentsClosed(); })
    .catch(function(){ /* 확인 실패 시엔 그대로 둡니다 — 제출 단계에서 다시 걸러집니다 */ });

  // ── 메타픽셀: 상품 조회 ──────────────────────────────────────
  //  이 페이지가 곧 '마음 사용 설명서'의 상품 페이지라, 진입을 조회로 봅니다.
  //  금액은 안내용 단가입니다 (실제 결제금액은 완료 페이지의 Purchase가 보냅니다).
  if (typeof fbq === 'function') {
    fbq('track', 'ViewContent', {
      content_type: 'product',
      content_ids: ['mind-manual'],
      content_name: '마음 사용 설명서',
      value: DISPLAY.unitPrice,
      currency: 'KRW'
    });
  }

  function won(n){ return '₩' + n.toLocaleString('ko-KR'); }

  function currentQty(){
    var n = parseInt(qty.value, 10);
    if (!Number.isInteger(n) || n < 1) n = 1;
    if (n > MAX_QTY) n = MAX_QTY;
    return n;
  }

  function refreshSummary(){
    var n = currentQty();
    qty.value = n;
    var items = DISPLAY.unitPrice * n;
    $('sumItems').textContent = won(items);
    $('sumShip').textContent = won(DISPLAY.shippingFee);
    $('sumTotal').textContent = won(items + DISPLAY.shippingFee);
  }

  $('qtyMinus').addEventListener('click', function(){ qty.value = currentQty() - 1; refreshSummary(); });
  $('qtyPlus').addEventListener('click', function(){ qty.value = currentQty() + 1; refreshSummary(); });
  qty.addEventListener('input', refreshSummary);
  refreshSummary();

  function show(text, kind){
    msg.textContent = text;
    msg.className = 'msg' + (kind ? ' ' + kind : '');
  }

  function paymentsClosed(){
    $('disabledNotice').hidden = false;
    form.hidden = true;
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    show('', '');

    if (!$('agreeTerms').checked){
      show('구매조건 확인 및 결제진행에 동의해 주세요.', 'err');
      $('agreeTerms').focus(); return;
    }
    if (!$('agreeMinor').checked){
      show('만 19세 미만인 경우 법정대리인 동의 확인이 필요합니다.', 'err');
      $('agreeMinor').focus(); return;
    }

    payBtn.disabled = true;
    show('주문서를 만들고 있어요…', '');

    fetch('/api/order', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        quantity: currentQty(),
        buyerName: $('buyerName').value,
        buyerEmail: $('buyerEmail').value,
        buyerPhone: $('buyerPhone').value,
        shipCountry: $('shipCountry').value,
        shipPostcode: $('shipPostcode').value,
        shipAddress1: $('shipAddress1').value,
        shipAddress2: $('shipAddress2').value,
        shipMemo: $('shipMemo').value,
        agreeTerms: true,
        agreeMinor: true
      })
    })
    .then(function(res){
      return res.json().catch(function(){ return {}; }).then(function(data){
        return {ok: res.ok, status: res.status, data: data};
      });
    })
    .then(function(r){
      if (r.status === 503 && r.data.code === 'PAYMENTS_DISABLED'){
        paymentsClosed();
        return;
      }
      if (!r.ok){
        show(r.data.error || '주문서를 만들지 못했습니다. 잠시 후 다시 시도해 주세요.', 'err');
        payBtn.disabled = false;
        return;
      }
      return startPayment(r.data);
    })
    .catch(function(){
      show('통신에 실패했습니다. 잠시 후 다시 시도해 주세요.', 'err');
      payBtn.disabled = false;
    });
  });

  function startPayment(order){
    show('결제창을 여는 중이에요…', '');

    // ── 메타픽셀: 결제 시작 ────────────────────────────────────
    //  주문서가 서버에서 만들어진 뒤(= 금액이 확정된 뒤) 결제창을 열기 직전에
    //  보냅니다. 결제창을 닫아도 이 이벤트는 남습니다 — 그래야
    //  '결제까지 갔는데 이탈한 사람'을 리타게팅할 수 있습니다.
    if (typeof fbq === 'function') {
      fbq('track', 'InitiateCheckout', {
        content_type: 'product',
        content_ids: ['mind-manual'],
        content_name: order.orderName,
        num_items: (order.breakdown && order.breakdown.quantity) || currentQty(),
        value: order.amount,
        currency: order.currency || 'KRW'
      });
    }

    var origin = window.location.origin;
    var toss = TossPayments(order.clientKey);
    var payment = toss.payment({ customerKey: TossPayments.ANONYMOUS });

    return payment.requestPayment({
      method: 'CARD',
      amount: { currency: order.currency, value: order.amount },
      orderId: order.orderId,
      orderName: order.orderName,
      customerName: order.customerName,
      customerEmail: order.customerEmail,
      successUrl: origin + '/checkout-result',
      failUrl: origin + '/checkout-result',
      card: { useEscrow: false, flowMode: 'DEFAULT', useCardPoint: false, useAppCardOnly: false }
    })
    .catch(function(err){
      // 사용자가 결제창을 닫은 경우 등
      show((err && err.message) || '결제가 취소되었습니다.', 'err');
      payBtn.disabled = false;
    });
  }
})();
</script>
</body>
</html>
